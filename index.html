<style>
:root{--bg:#faf6ef;--surface:#fff;--ink:#22201c;--muted:#6f685c;--line:#e6dfd2;--accent:#a3262a;--gold:#b8892b}
@media (prefers-color-scheme:dark){:root{--bg:#161412;--surface:#211e1b;--ink:#f1ece3;--muted:#a59d90;--line:#34302a;--accent:#e2686b;--gold:#d9ad55}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{text-align:center;padding:40px 16px 8px}
header p.kicker{margin:0;color:var(--gold);font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
h1{margin:6px 0 0;font:700 clamp(30px,6vw,46px)/1.1 Georgia,"Times New Roman",serif;color:var(--accent)}
main{max-width:1100px;margin:0 auto;padding:24px 16px 40px;display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--line)}
.info{padding:14px 16px 16px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h2{margin:0;font-size:18px;font-weight:600;overflow-wrap:anywhere}
.price{margin:0;font-size:22px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
footer{text-align:center;color:var(--muted);font-size:13px;padding:0 16px 32px}
</style>
